theme = "catppuccin-mocha"
mode = "unified"
watch = true
line_numbers = false
hunk_headers = false
menu_bar = false
animations = false
sidebar = true
agent_notes = true
prompt_save_view_preferences = false

[keybindings]
"hunk.app.quit" = "escape"
"hunk.review.nextNote" = ")"
"hunk.review.previousNote" = "("
"hunk.review.previousFile" = "left"
"hunk.review.nextFile" = "right"
